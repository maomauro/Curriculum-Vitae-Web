name: Deploy frontend to VPS

# Reconstruye la imagen de Nginx (build de Angular + servido estatico) y la
# despliega en el VPS de produccion cuando hay cambios en frontend/**. A
# diferencia del backend, esta imagen no se publica en GHCR: se construye
# directamente en el VPS (ver docs/produccion/Plan-Trabajo-Produccion.md
# Fase 3/6).
#
# Requiere los secrets SSH_HOST, SSH_USER, SSH_DEPLOY_KEY y SSH_KNOWN_HOSTS (los mismos que deploy-backend.yml).
#
# La llave SSH_DEPLOY_KEY esta RESTRINGIDA en el servidor (restrict,command=/usr/local/sbin/portalcv-entrada.sh):
# solo puede ejecutar `desplegar-frontend` o `desplegar-backend`, no abre una shell. Lo que hace cada orden esta en
# deploy/entrada.sh (H-003).

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (llave restringida)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" desplegar-frontend
