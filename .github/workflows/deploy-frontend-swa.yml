name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-swa.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-swa
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: Inject runtime config into index.html
        run: |
          node -e "
            const fs = require('fs');
            const path = 'dist/portalcv-web/browser/index.html';
            const marker = '<!-- APP_CONFIG_INJECT';
            const html = fs.readFileSync(path, 'utf8');
            const start = html.indexOf(marker);
            const end = html.indexOf('-->', start) + '-->'.length;
            if (start === -1 || end === -1) {
              throw new Error('Marcador APP_CONFIG_INJECT no encontrado en index.html');
            }
            const config = JSON.stringify({ apiBaseUrl: process.env.API_BASE_URL });
            const script = '<script>window.__PORTALCV_CONFIG__ = ' + config + ';<' + '/script>';
            fs.writeFileSync(path, html.slice(0, start) + script + html.slice(end));
          "
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "frontend/dist/portalcv-web/browser"
          output_location: ""
          skip_app_build: true
