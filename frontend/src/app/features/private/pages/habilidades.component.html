<!-- Cabecera — prototipo habilidades.html -->
<div class="page-header">
  <div>
    <h4><i class="bi bi-stars me-2 text-primary"></i>Habilidades</h4>
    <p class="text-muted small mb-0">
      Registra habilidades técnicas, blandas e idiomas; cada registro se guarda automáticamente.
    </p>
  </div>
</div>

<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
</div>

<ng-container *ngIf="!loading">

<!-- Secciones de habilidades (Técnica/Blanda/Idioma) — mismo bloque, parametrizado por sec -->
<div [class]="'seccion-card hab-' + sec.claseId + '-block overflow-hidden'" *ngFor="let sec of secciones">
  <div [class]="'d-flex flex-wrap justify-content-between align-items-center gap-3 hab-' + sec.claseId + '-head'">
    <div class="d-flex align-items-start gap-2 flex-grow-1 min-w-0 hab-accordion-title-hit rounded px-1 py-1"
         role="button" tabindex="0"
         id="hab-trigger-{{ sec.claseId }}"
         [attr.aria-expanded]="isAccordionOpen(sec.tipo)"
         attr.aria-controls="hab-panel-{{ sec.claseId }}"
         (click)="toggleAccordion(sec.tipo)"
         (keydown.enter)="toggleAccordion(sec.tipo)"
         (keydown.space)="$event.preventDefault(); toggleAccordion(sec.tipo)">
      <i class="bi cv-chevron-muted flex-shrink-0 mt-1" aria-hidden="true"
         [class.bi-chevron-down]="!isAccordionOpen(sec.tipo)"
         [class.bi-chevron-up]="isAccordionOpen(sec.tipo)"></i>
      <div>
        <div class="seccion-titulo mb-0"><i class="bi" [class]="sec.icono"></i>{{ sec.titulo }}</div>
        <div class="seccion-subtitulo mb-0">{{ sec.subtitulo }}</div>
      </div>
    </div>
    <button type="button" class="btn btn-outline-secondary btn-sm flex-shrink-0"
            (click)="onAgregarHabilidadClick($event, sec.tipo)"
            [disabled]="hayBorradorDe(sec.tipo)"
            [attr.title]="hayBorradorDe(sec.tipo) ? 'Completa o cancela la fila nueva antes de agregar otra.' : null">
      <i class="bi bi-plus-circle me-1"></i>{{ sec.botonLabel }}
    </button>
  </div>

  <div *ngIf="isAccordionOpen(sec.tipo)" id="hab-panel-{{ sec.claseId }}" role="region"
       attr.aria-labelledby="hab-trigger-{{ sec.claseId }}"
       class="hab-accordion-panel cv-border-t-soft pt-3">
  <div [class]="'hab-' + sec.claseId + '-rows'">
    <div class="skill-row skill-row--header">
      <div class="skill-name"><small class="text-muted fw-bold">Nombre</small></div>
      <div class="skill-level"><small class="text-muted fw-bold">Nivel</small></div>
      <div class="skill-desc"><small class="text-muted fw-bold">Descripción (opcional)</small></div>
      <div class="skill-actions" aria-hidden="true"></div>
    </div>

    <div class="skill-row" *ngFor="let skill of guardadasDe(sec.tipo)">
      <div class="skill-name">
        <input type="text" class="form-control form-control-sm" [(ngModel)]="skill.nombre"
               [attr.aria-label]="sec.nombreAriaLabel"
               (blur)="onSkillFieldCommit(skill)"
               [placeholder]="sec.nombrePlaceholder">
      </div>
      <div class="skill-level">
        <select class="form-select form-select-sm" aria-label="Nivel" [(ngModel)]="skill.nivel" (change)="onSkillFieldCommit(skill)">
          <option *ngFor="let n of niveles" [ngValue]="n">{{ n }}</option>
        </select>
      </div>
      <div class="skill-desc">
        <input type="text" class="form-control form-control-sm" [(ngModel)]="skill.descripcion"
               aria-label="Descripción (opcional)"
               (blur)="onSkillFieldCommit(skill)"
               placeholder="Descripción opcional">
      </div>
      <div class="skill-actions">
        <button type="button" class="btn-hab-del" (click)="eliminar(skill)" [attr.title]="sec.eliminarTitle">
          <i class="bi bi-trash3"></i>
        </button>
      </div>
    </div>

    <div class="skill-row" *ngIf="borradorDe(sec.tipo) as draft">
      <div class="skill-name">
        <input type="text" class="form-control form-control-sm" [(ngModel)]="draft.nombre"
               [attr.aria-label]="sec.nombreAriaLabel"
               (blur)="onSkillFieldCommit(draft)"
               [placeholder]="sec.nombrePlaceholder">
      </div>
      <div class="skill-level">
        <select class="form-select form-select-sm" aria-label="Nivel" [(ngModel)]="draft.nivel" (change)="onSkillFieldCommit(draft)">
          <option *ngFor="let n of niveles" [ngValue]="n">{{ n }}</option>
        </select>
      </div>
      <div class="skill-desc">
        <input type="text" class="form-control form-control-sm" [(ngModel)]="draft.descripcion"
               aria-label="Descripción (opcional)"
               (blur)="onSkillFieldCommit(draft)"
               placeholder="Descripción opcional">
      </div>
      <div class="skill-actions">
        <button type="button" class="btn-hab-del" (click)="cancelarBorrador(draft)"
                title="Cancelar fila nueva (sin guardar)">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <div class="skill-row" *ngIf="guardadasDe(sec.tipo).length === 0 && !hayBorradorDe(sec.tipo)">
      <div class="w-100 text-muted small text-center py-3">
        {{ sec.emptyMensaje }}
      </div>
    </div>
  </div>
  </div>
</div>

</ng-container>
