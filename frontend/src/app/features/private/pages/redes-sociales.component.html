<!-- Page Header -->
<div class="page-header" *ngIf="!embedded">
  <div>
    <h4><i class="bi bi-share-fill me-2 text-primary"></i>Redes Sociales</h4>
    <span class="text-muted small">Perfil público, portafolio y redes profesionales</span>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="activarTodas()"
            *ngIf="hayRedesGuardadas"
            [disabled]="guardandoVisibilidadBloque || !hayRedesOcultas"
            title="Muestra en el CV todas las redes registradas">
      <i class="bi bi-eye me-1"></i>Activar todas
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="inactivarTodas()"
            *ngIf="hayRedesGuardadas"
            [disabled]="guardandoVisibilidadBloque || !hayRedesVisibles"
            title="Oculta del CV todas las redes registradas">
      <i class="bi bi-eye-slash me-1"></i>Inactivar todas
    </button>
    <button type="button" class="btn btn-primary btn-sm" (click)="agregar()">
      <i class="bi bi-plus-circle me-1"></i>Agregar red
    </button>
  </div>
</div>

<div class="d-flex flex-wrap justify-content-end gap-2 mb-2" *ngIf="embedded">
  <button type="button" class="btn btn-outline-secondary btn-sm" (click)="activarTodas()"
          *ngIf="hayRedesGuardadas"
          [disabled]="guardandoVisibilidadBloque || !hayRedesOcultas"
          title="Muestra en el CV todas las redes registradas">
    <i class="bi bi-eye me-1"></i>Activar todas
  </button>
  <button type="button" class="btn btn-outline-secondary btn-sm" (click)="inactivarTodas()"
          *ngIf="hayRedesGuardadas"
          [disabled]="guardandoVisibilidadBloque || !hayRedesVisibles"
          title="Oculta del CV todas las redes registradas">
    <i class="bi bi-eye-slash me-1"></i>Inactivar todas
  </button>
  <button type="button" class="btn btn-primary btn-sm" (click)="agregar()">
    <i class="bi bi-plus-circle me-1"></i>Agregar red
  </button>
</div>

<!-- Loading -->
<div *ngIf="loading" class="text-center" [class.py-5]="!embedded" [class.py-3]="embedded">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
</div>

<!-- Sin datos -->
<div *ngIf="!loading && redes.length === 0" class="text-center text-muted" [class.py-5]="!embedded" [class.py-3]="embedded">
  <i class="bi bi-share display-5"></i>
  <p class="mt-3">No tienes redes sociales registradas. Agrega la primera.</p>
</div>

<!-- Lista (ancho completo como referencias / familiares) -->
<div *ngFor="let red of redes; let i = index">
  <div class="bg-white rounded-3 shadow-sm mb-3 overflow-hidden">

    <!-- Vista normal -->
    <div *ngIf="!red.editando" class="p-4 d-flex align-items-center gap-3" [class.opacity-50]="!red.mostrarEnCv">
      <div class="cv-icon-box--social"
           [style.color]="iconoColor(red.nombreRed)">
        <i class="bi" [class]="iconoClase(red.nombreRed)"></i>
      </div>
      <div class="flex-grow-1 overflow-hidden">
        <div class="fw-semibold">
          {{ red.nombreRed }}
          <span *ngIf="red.mostrarEnCv" class="badge-active"><i class="bi bi-check-circle-fill" aria-hidden="true"></i>En CV</span>
          <span *ngIf="!red.mostrarEnCv" class="badge-inactive">No visible en CV</span>
        </div>
        <div class="text-muted small text-truncate">
          {{ red.linkPublico || red.usuarioContacto || '—' }}
        </div>
      </div>
      <div class="form-check form-switch mb-0 flex-shrink-0" title="Mostrar en Mi CV">
        <input class="form-check-input" type="checkbox" role="switch"
               aria-label="Mostrar en Mi CV"
               [ngModel]="red.mostrarEnCv"
               (ngModelChange)="onMostrarEnCvChange(red, $event)"
               [disabled]="guardandoVisibilidadRedSocialId === red.redSocialId">
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-sm btn-outline-secondary"
                (click)="red.editando = true; red.form = toForm(red)">
          <i class="bi bi-pencil"></i>
        </button>
        <button type="button" class="btn btn-outline-danger btn-sm" (click)="eliminar(red)">
          <i class="bi bi-trash3 me-1"></i>Eliminar
        </button>
      </div>
    </div>

    <!-- Modo edición -->
    <div *ngIf="red.editando" class="px-4 pb-4 cv-border-t-soft">
      <div class="row g-3 mt-1">
        <div class="col-md-6">
          <label class="form-label" [for]="'red-nombre-'+i">Red social</label>
          <select [id]="'red-nombre-'+i" class="form-select" [(ngModel)]="red.form.nombreRed">
            <option *ngFor="let op of redesOpciones" [value]="op.nombre">{{ op.nombre }}</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" [for]="'red-usuario-'+i">Usuario / Contacto</label>
          <input [id]="'red-usuario-'+i" type="text" class="form-control" [(ngModel)]="red.form.usuarioContacto"
                 placeholder="@usuario">
        </div>
        <div class="col-12">
          <label class="form-label" [for]="'red-link-'+i">URL / Enlace público</label>
          <input [id]="'red-link-'+i" type="url" class="form-control" [(ngModel)]="red.form.linkPublico"
                 placeholder="https://...">
        </div>
      </div>
      <div class="d-flex gap-2 mt-3 justify-content-end">
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancelar(red)">Cancelar</button>
        <button type="button" class="btn btn-primary btn-sm" (click)="guardar(red)" [disabled]="guardando">
          <span *ngIf="guardando" class="spinner-border spinner-border-sm me-1"></span>
          <i *ngIf="!guardando" class="bi bi-floppy me-1"></i>Guardar
        </button>
      </div>
    </div>

  </div>
</div>
