  <!-- APP_CONFIG_INJECT: en produccion, deploy-frontend-swa.yml reemplaza este comentario
       por <script>window.__PORTALCV_CONFIG__ = {...}</script> luego del build, con la config
       ya resuelta (sin red, sin XHR). Debe quedar ANTES del bundle de Angular: api-base-url.ts
       calcula API_BASE_URL como constante al importarse, sin esperar a nada asincrono, asi que
       si la config no esta disponible en ese instante, la constante queda congelada en el valor
       de fallback para siempre. En entornos sin inyeccion (ng serve local), simplemente no se
       define window.__PORTALCV_CONFIG__ y API_BASE_URL usa su fallback por hostname (relativo,
       via proxy.conf.js). -->
