<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PortalcvWeb</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Carga sincrona (bloqueante) de la config runtime. Debe completarse ANTES de que
    // el bundle de Angular evalue sus modulos: api-base-url.ts calcula API_BASE_URL como
    // constante al importarse, sin esperar a un fetch asincrono, asi que si esta config
    // no esta disponible en ese instante, la constante queda congelada en el valor de
    // fallback para siempre (aunque app-config.json se cargue correctamente despues).
    (function () {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/app-config.json', false);
        xhr.send(null);
        if (xhr.status === 200) {
          window.__PORTALCV_CONFIG__ = JSON.parse(xhr.responseText);
        }
      } catch (err) {
        console.warn('No se pudo cargar app-config.json; se usara la configuracion por defecto.', err);
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
