# Nginx interno de PortalCV: sirve el SPA de Angular y hace proxy de /api y /health hacia el backend (.NET) -- mismo
# esquema de origen unico que usa el proxy de `ng serve` en desarrollo (ver frontend/proxy.conf.js).
#
# NO termina TLS ni se publica en el host: el gateway de plataforma (repo sitiosapps-gateway) recibe el 443, exige el
# certificado de cliente de Cloudflare y llega aqui por HTTP en la red sitiosapps-edge (alias portalcv-web). El
# gateway SOBRESCRIBE CF-Connecting-IP y X-Forwarded-Proto, por eso aqui se pueden usar como verdad.

# IP real del visitante: la que fija el gateway; si falta (llamada directa dentro de la red) cae a la del vecino.
map $http_cf_connecting_ip $ip_cliente {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Esquema original (https): el backend lo necesita para las cookies Secure.
map $http_x_forwarded_proto $esquema_cliente {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Por defecto Nginx limita el cuerpo de la peticion a 1M y responde 413 antes de que llegue al backend. El limite
    # mas alto entre los controladores de la API es 8_000_000 bytes (OfertaController, analisis de ofertas con
    # imagen), asi que se deja margen. El gateway aplica el mismo limite (10m).
    client_max_body_size 10M;

    # Backend .NET, alcanzable por nombre de servicio en la red privada de Docker Compose.
    # X-Forwarded-For lleva UNA sola entrada (la IP real): Program.cs toma la ultima y solo la acepta si el vecino
    # directo (este contenedor) esta en 172.28.0.0/24.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ip_cliente;
        proxy_set_header X-Forwarded-For $ip_cliente;
        proxy_set_header X-Forwarded-Proto $esquema_cliente;
    }

    location /health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $esquema_cliente;
    }

    # SPA de Angular: sirve el archivo pedido o cae a index.html (rutas del router).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
