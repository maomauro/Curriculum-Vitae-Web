# Nginx de produccion para PortalCV: sirve el SPA de Angular y hace proxy de
# /api y /health hacia el backend (.NET) -- mismo esquema de origen unico que
# usa el proxy de `ng serve` en desarrollo (ver frontend/proxy.conf.js).
#
# Certificado: certificado de Origen de Cloudflare, generado desde el panel de
# Cloudflare e instalado a mano en el VPS (ver
# docs/produccion/Plan-Trabajo-Produccion.md Fase 2/3). Se monta por bind mount
# desde /etc/nginx/ssl del host -- ver docker-compose.prod.yml.

server {
    listen 80;
    server_name portalcv.sitiosapps.com;

    # Cloudflare en modo Full/Full strict siempre reintenta por HTTPS -- este
    # bloque solo cubre el caso borde de alguien pegandole directo al puerto 80.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name portalcv.sitiosapps.com;

    ssl_certificate     /etc/nginx/ssl/portalcv.sitiosapps.com.pem;
    ssl_certificate_key /etc/nginx/ssl/portalcv.sitiosapps.com.key;

    # Por defecto Nginx limita el cuerpo de la peticion a 1M y responde 413
    # antes de que la peticion llegue al backend. El limite mas alto entre los
    # controladores de la API es 8_000_000 bytes (OfertaController, analisis de
    # ofertas con imagen), asi que dejamos margen sobre ese valor.
    client_max_body_size 10M;

    # Backend .NET, alcanzable por nombre de servicio en la red de Docker Compose.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA de Angular: sirve el archivo pedido o cae a index.html (rutas del router).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
