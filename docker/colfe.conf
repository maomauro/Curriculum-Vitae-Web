# Bloque para el nginx DEL SERVIDOR (contenedor portalcv-nginx-prod, que ya atiende 80/443).
# Se monta como /etc/nginx/conf.d/colfe.conf (ver docs/DESPLIEGUE.md, sección 3).
#
# COLFE no publica puertos: este nginx lo alcanza por la red compartida (PROXY_NETWORK) con el
# nombre «colfe-web». El certificado de origen de Cloudflare va en /etc/nginx/ssl (carpeta del
# host, ya montada en ese contenedor).

server {
    listen 80;
    server_name colfe.sitiosapps.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name colfe.sitiosapps.com;

    ssl_certificate     /etc/nginx/ssl/colfe.sitiosapps.com.pem;
    ssl_certificate_key /etc/nginx/ssl/colfe.sitiosapps.com.key;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8m;

    # IMPORTANTE: el nombre se resuelve en cada petición (resolver de Docker), no al arrancar.
    # Con un proxy_pass fijo, si el contenedor colfe-web no existe cuando nginx arranca o
    # recarga, nginx NO inicia y PortalCV se cae también.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $colfe_upstream http://colfe-web:80;

    location / {
        proxy_pass $colfe_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Con Cloudflare delante, la IP real del cliente llega en CF-Connecting-IP.
        # COLFE la usa para bloquear intentos de login repetidos (REAL_IP_HEADER=X-Forwarded-For).
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
